name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build
        run: dotnet build Penghou.Siming.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Siming.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Penghou.Siming.slnx --configuration Release --no-build

      - name: Run samples
        run: dotnet run --project samples/Penghou.Siming.Samples --configuration Release --no-build

      - name: Verify independent golden vector
        run: python tools/verify_golden_vectors.py

      - name: Validate packages
        run: dotnet pack Penghou.Siming.slnx --configuration Release --no-build --output artifacts --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Restore and audit packed consumer
        shell: pwsh
        run: ./tools/verify_packed_consumer.ps1 -PackageDirectory artifacts -Version 0.0.0-ci.${{ github.run_id }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
