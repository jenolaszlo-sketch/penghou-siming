name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build
        run: dotnet build Penghou.Siming.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Siming.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Penghou.Siming.slnx --configuration Release --no-build

      - name: Verify independent golden vector
        run: python tools/verify_golden_vectors.py

      - name: Validate packages
        run: dotnet pack Penghou.Siming.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
